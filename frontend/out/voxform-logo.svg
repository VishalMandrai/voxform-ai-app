<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="587" height="264" viewBox="0 0 587 264">

  <!-- =========================================================
       VOXFORM LOGO
       Three independently movable components:
       1. #voxform-text  : the complete VoxForm wordmark
       2. #voxform-mic   : the complete microphone icon
       3. #voxform-bars  : the complete waveform/bar decoration
       ========================================================= -->

  <!-- TEXT: one SVG text element -->
  <text id="voxform-text"
        x="112" y="172"
        font-family="Arial, Helvetica, sans-serif"
        font-size="104"
        font-weight="700"
        letter-spacing="-4">
    <tspan fill="#22d5e2">Vox</tspan><tspan fill="#ffffff">Form</tspan>
  </text>

  <!-- MICROPHONE: one independent SVG group -->
  <g id="voxform-mic"
     fill="none"
     stroke="#ffffff"
     stroke-width="9"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- microphone capsule -->
    <rect x="47" y="61" width="48" height="83" rx="24" fill="#0a81a5"/>

    <!-- capsule internal light-blue/purple bars -->
    <path d="M54 82H88" stroke="#f7f8f9" stroke-width="6"/>
    <path d="M54 99H88" stroke="#f7f8f9" stroke-width="6"/>
    <path d="M54 116H88" stroke="#f7f8f9" stroke-width="6"/>
    <!-- <path d="M58 133H82" stroke="#f7f8f9" stroke-width="6"/> -->

    <!-- microphone outer support -->
    <path d="M31 126V137C31 160 49 178 71 178C93 178 111 160 111 137V126"/>
    <path d="M71 178V199"/>
    <path d="M46 199H96"/>
  </g>

  <!-- WAVEFORM: one independent SVG group -->
  <g id="voxform-bars" stroke-linecap="round" stroke-width="5">

    <!-- left waveform -->
    <g stroke="#75cbe6">
      <line x1="260" y1="110" x2="260" y2="95"/>
      <line x1="275" y1="110" x2="275" y2="85"/>
      <line x1="290" y1="90" x2="290" y2="75"/>
      <line x1="305" y1="90" x2="305" y2="65"/>
      <line x1="320" y1="90" x2="320" y2="50"/>
      <line x1="335" y1="90" x2="335" y2="55"/>
      <line x1="350" y1="110" x2="350" y2="60"/>
      <line x1="365" y1="110" x2="365" y2="70"/>
    </g>

    <!-- central/right waveform -->
    <g stroke="#a2dae9">
      <line x1="380" y1="110" x2="380" y2="60"/>
      <line x1="395" y1="110" x2="395" y2="50"/>
      <line x1="410" y1="110" x2="410" y2="40"/>
      <line x1="425" y1="110" x2="425" y2="30"/>
      <line x1="440" y1="110" x2="440" y2="40"/>
      <line x1="455" y1="110" x2="455" y2="50"/>
    </g>

    <!-- right waveform -->
    <g stroke="#0a81a5">
      <line x1="470" y1="110" x2="470" y2="40"/>
      <line x1="485" y1="110" x2="485" y2="30"/>
      <line x1="500" y1="110" x2="500" y2="60"/>
      <line x1="515" y1="110" x2="515" y2="70"/>
      <!-- <line x1="530" y1="75" x2="530" y2="143"/>
      <line x1="545" y1="91" x2="545" y2="126"/>
      <line x1="558" y1="106" x2="558" y2="116"/> -->
    </g>

    <!-- lower waveform echoes -->
    <g stroke="#75cbe6">
      <line x1="290" y1="178" x2="290" y2="191"/>
      <line x1="305" y1="178" x2="305" y2="205"/>
      <line x1="320" y1="178" x2="320" y2="217"/>
      <line x1="335" y1="178" x2="335" y2="201"/>
      <line x1="350" y1="178" x2="350" y2="211"/>
      <line x1="365" y1="178" x2="365" y2="197"/>
    </g>

    <g stroke="#a2dae9">
      <line x1="380" y1="178" x2="380" y2="224"/>
      <line x1="395" y1="178" x2="395" y2="239"/>
      <line x1="410" y1="178" x2="410" y2="220"/>
      <line x1="425" y1="178" x2="425" y2="239"/>
      <line x1="440" y1="178" x2="440" y2="216"/>
      <line x1="455" y1="178" x2="455" y2="203"/>
    </g>

    <g stroke="#0a81a5">
      <line x1="470" y1="178" x2="470" y2="201"/>
      <line x1="485" y1="178" x2="485" y2="191"/>
      <line x1="500" y1="178" x2="500" y2="199"/>
      <line x1="515" y1="178" x2="515" y2="190"/>
      <!-- <line x1="530" y1="176" x2="530" y2="196"/> -->
    </g>
  </g>
</svg>
